<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارائه: معماری Serverless و مقایسه با رویکردهای سنتی</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

  :root {
    --bg-dark: #0b1220;
    --bg-slide: #101a2e;
    --panel: #16233b;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --text: #e6edf7;
    --muted: #9fb0c9;
    --border: rgba(255,255,255,.09);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html,body {
    height:100%;
    background: radial-gradient(1200px 700px at 80% -10%, #16305a 0%, transparent 60%),
                radial-gradient(900px 600px at -10% 110%, #1d2a52 0%, transparent 55%),
                var(--bg-dark);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    overflow: hidden;
  }

  #app { height:100%; display:flex; flex-direction:column; }

  /* ---------- Top bar ---------- */
  .topbar {
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background: rgba(10,16,30,.75);
    border-bottom:1px solid var(--border);
    backdrop-filter: blur(8px);
    z-index:20;
  }
  .brand { font-weight:700; font-size:14px; color:var(--accent); letter-spacing:.3px; }
  .brand span { color:var(--muted); font-weight:400; }
  .progress-wrap { flex:1; height:6px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
  .progress-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .35s ease; border-radius:99px; }
  .counter { font-size:13px; color:var(--muted); font-variant-numeric: tabular-nums; min-width:64px; text-align:center; }

  .btn {
    background: rgba(255,255,255,.06);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 12px; border-radius:8px;
    font-family:inherit; font-size:13px; cursor:pointer;
    transition:.18s;
  }
  .btn:hover { background:rgba(56,189,248,.18); border-color:var(--accent); }
  .btn.active { background:rgba(56,189,248,.28); border-color:var(--accent); color:#fff; }

  /* ---------- Stage ---------- */
  .stage {
    flex:1; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:8px;
    min-height:0;
  }

  .slide {
    display:none;
    width:100%; height:100%;
    background: linear-gradient(160deg, #14213c 0%, #0e1730 60%, #101c38 100%);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    padding:56px 70px;
    overflow:auto;
    position:relative;
    animation: fade .4s ease;
  }
  .slide.active {
    display:flex; flex-direction:column;
    justify-content:center;
    justify-content:safe center;
  }
  @keyframes fade { from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:none;} }

  .slide::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(600px 300px at 100% 0%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(500px 320px at 0% 100%, rgba(167,139,250,.10), transparent 60%);
    pointer-events:none; border-radius:20px;
  }
  .slide > * { position:relative; z-index:1; }

  .slide-num {
    position:absolute; left:30px; top:24px;
    font-size:16px; color:var(--muted);
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    padding:5px 16px; border-radius:99px; z-index:2;
  }

  .kicker {
    display:inline-block; font-size:20px; color:var(--accent);
    background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.35);
    padding:7px 22px; border-radius:99px; margin-bottom:22px; font-weight:500;
    align-self:flex-start;
  }
  .kicker.sec { color:var(--accent2); background:rgba(167,139,250,.13); border-color:rgba(167,139,250,.4); }
  .kicker.good { color:var(--accent3); background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.4); }
  .kicker.warn { color:var(--warn); background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.4); }

  h1.slide-title {
    font-size:62px; font-weight:900; line-height:1.35;
    margin-bottom:30px;
    background:linear-gradient(90deg,#fff, #bcd7ff 60%, var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle { color:var(--muted); font-size:28px; margin-bottom:38px; line-height:1.8; }

  ul.content { list-style:none; display:flex; flex-direction:column; gap:22px; }
  ul.content li {
    background: rgba(255,255,255,.045);
    border:1px solid var(--border);
    border-right:6px solid var(--accent);
    padding:24px 30px; border-radius:16px;
    font-size:31px; line-height:1.85;
    display:flex; gap:20px; align-items:flex-start;
  }
  ul.content li.sub { border-right-color:var(--accent2); background:rgba(255,255,255,.03); font-size:28px; }
  ul.content li.good { border-right-color:var(--accent3); }
  ul.content li.bad { border-right-color:var(--danger); }
  ul.content li.warnb { border-right-color:var(--warn); }
  .ico { flex:0 0 auto; font-size:32px; line-height:1.6; }

  b, strong { color:#fff; font-weight:700; }
  .hl { color:var(--accent); font-weight:700; }
  .hl2 { color:var(--accent2); font-weight:700; }
  .hl3 { color:var(--accent3); font-weight:700; }
  .hlw { color:var(--warn); font-weight:700; }
  .hld { color:var(--danger); font-weight:700; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:22px; }

  .card {
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:20px; padding:34px 38px;
  }
  .card h4 { font-size:32px; color:var(--accent); margin-bottom:18px; }
  .card p, .card li { font-size:28px; color:var(--muted); line-height:1.85; }
  .card.a2 h4 { color:var(--accent2); }
  .card.a3 h4 { color:var(--accent3); }
  .card.aw h4 { color:var(--warn); }
  .card.ad h4 { color:var(--danger); }

  /* Title slide */
  .title-slide { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .title-slide .logo {
    width:130px; height:130px; border-radius:34px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-size:62px; margin-bottom:44px;
    box-shadow:0 14px 40px rgba(56,189,248,.35);
  }
  .title-slide h1 { font-size:72px; font-weight:900; line-height:1.4; margin-bottom:30px;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .title-slide .sub { font-size:30px; color:var(--muted); line-height:2; max-width:1300px; margin-bottom:54px; }
  .meta { display:flex; flex-wrap:wrap; gap:22px; justify-content:center; }
  .meta .m {
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    padding:22px 38px; border-radius:18px; font-size:26px;
  }
  .meta .m span { color:var(--muted); font-size:21px; display:block; margin-bottom:8px; }
  .meta .m b { color:var(--accent); font-weight:600; }

  /* TOC */
  .toc { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .toc .item {
    display:flex; gap:24px; align-items:center;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:20px; padding:30px 34px; transition:.2s;
  }
  .toc .item:hover { border-color:var(--accent); background:rgba(56,189,248,.08); }
  .toc .n {
    flex:0 0 auto; width:76px; height:76px; border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:36px; color:#0b1220;
  }
  .toc .t { font-weight:700; font-size:27px; }
  .toc .r { font-size:22px; color:var(--muted); margin-top:8px; }

  /* Table */
  table.cmp {
    width:100%; border-collapse:separate; border-spacing:0;
    font-size:26px; margin-top:6px;
    background:rgba(255,255,255,.04); border-radius:18px; overflow:hidden;
    border:1px solid var(--border);
  }
  table.cmp th, table.cmp td { padding:22px 24px; text-align:right; border-bottom:1px solid var(--border); }
  table.cmp th { background:linear-gradient(90deg, rgba(56,189,248,.25), rgba(167,139,250,.2)); font-weight:700; font-size:25px; }
  table.cmp tr:last-child td { border-bottom:none; }
  table.cmp td:first-child { color:var(--muted); font-weight:600; }
  table.cmp tbody tr:hover { background:rgba(255,255,255,.04); }
  .pill { padding:7px 20px; border-radius:99px; font-size:23px; font-weight:700; display:inline-block; }
  .p-ok { background:rgba(52,211,153,.18); color:var(--accent3); }
  .p-mid { background:rgba(251,191,36,.18); color:var(--warn); }
  .p-bad { background:rgba(248,113,113,.18); color:var(--danger); }

  /* Checklist */
  .check { display:flex; flex-direction:column; gap:22px; }
  .check .c {
    display:flex; gap:24px; align-items:center;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:18px; padding:28px 34px; font-size:27px;
  }
  .check .box {
    flex:0 0 auto; width:46px; height:46px; border-radius:12px;
    border:3px solid var(--accent); display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-weight:900; font-size:27px;
  }
  .check .verdict { margin-inline-start:auto; font-size:23px; font-weight:700; white-space:nowrap;
    padding:9px 24px; border-radius:99px; }
  .v-yes { background:rgba(52,211,153,.16); color:var(--accent3); }
  .v-no { background:rgba(248,113,113,.16); color:var(--danger); }

  /* Section divider */
  .divider { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .divider .big {
    font-size:200px; font-weight:900; line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:.9; margin-bottom:26px;
  }
  .divider h1 { font-size:62px; font-weight:900; margin-bottom:30px; }
  .divider p { color:var(--muted); font-size:28px; max-width:1250px; line-height:2; }

  /* Formula */
  .formula {
    background:#0a1020; border:1px solid rgba(56,189,248,.35);
    border-radius:20px; padding:42px; text-align:center;
    font-size:40px; font-weight:700; color:var(--accent);
    font-family: 'Courier New', monospace; direction:ltr;
    box-shadow: inset 0 0 40px rgba(56,189,248,.06);
  }
  .formula .op { color:var(--accent2); }

  /* Stats */
  .stat {
    background:linear-gradient(160deg, rgba(56,189,248,.14), rgba(255,255,255,.03));
    border:1px solid rgba(56,189,248,.3); border-radius:24px;
    padding:44px 32px; text-align:center;
  }
  .stat .num { font-size:66px; font-weight:900; color:var(--accent); line-height:1.3; }
  .stat .lbl { font-size:25px; color:var(--muted); margin-top:16px; line-height:1.8; }
  .stat.g { background:linear-gradient(160deg, rgba(52,211,153,.14), rgba(255,255,255,.03)); border-color:rgba(52,211,153,.3); }
  .stat.g .num { color:var(--accent3); }
  .stat.v { background:linear-gradient(160deg, rgba(167,139,250,.14), rgba(255,255,255,.03)); border-color:rgba(167,139,250,.3); }
  .stat.v .num { color:var(--accent2); }
  .stat.r { background:linear-gradient(160deg, rgba(248,113,113,.14), rgba(255,255,255,.03)); border-color:rgba(248,113,113,.3); }
  .stat.r .num { color:var(--danger); }

  .flow { display:flex; align-items:stretch; gap:18px; flex-wrap:wrap; }
  .flow .step {
    flex:1; min-width:260px;
    background:rgba(255,255,255,.05); border:1px solid var(--border);
    border-radius:18px; padding:32px; text-align:center;
  }
  .flow .step .n { font-size:21px; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .flow .step .d { font-size:25px; line-height:1.85; color:var(--muted); }
  .flow .arr { display:flex; align-items:center; font-size:40px; color:var(--accent); }

  .note {
    margin-top:26px; font-size:23px; color:var(--muted);
    background:rgba(255,255,255,.04); border:2px dashed var(--border);
    border-radius:16px; padding:24px 30px; line-height:1.9;
    align-self:stretch;
    text-align:center;
  }
  .title-slide .note {
    align-self:auto;
    max-width:900px;
    margin-inline:auto;
  }

  /* ---------- Bottom bar ---------- */
  .bottombar {
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    background: rgba(10,16,30,.75);
    border-top:1px solid var(--border);
    backdrop-filter: blur(8px);
    z-index:20;
  }
  .nav { display:flex; gap:8px; }
  .nav .btn { min-width:96px; text-align:center; font-weight:600; }
  .nav .btn:disabled { opacity:.35; cursor:not-allowed; }
  .hint { flex:1; text-align:center; font-size:12.5px; color:var(--muted); }
  kbd {
    background:rgba(255,255,255,.1); border:1px solid var(--border);
    border-bottom-width:2px; border-radius:5px; padding:1px 7px;
    font-size:11.5px; font-family:inherit; color:#fff;
  }

  /* Speaker notes */
  .notes {
    display:none;
    position:fixed; left:0; right:0; bottom:56px;
    max-height:38vh; overflow:auto;
    background:rgba(8,13,26,.97); border-top:2px solid var(--accent2);
    padding:20px 30px; z-index:40;
    box-shadow:0 -20px 50px rgba(0,0,0,.6);
  }
  .notes.show { display:block; animation:slideup .3s ease; }
  @keyframes slideup { from{transform:translateY(30px); opacity:0;} to{transform:none;opacity:1;} }
  .notes h3 { color:var(--accent2); font-size:15px; margin-bottom:10px; }
  .notes p { font-size:15.5px; line-height:2.1; color:#d6e2f5; }

  /* overview */
  .overview {
    display:none; position:fixed; inset:0; z-index:60;
    background:rgba(6,10,20,.97); overflow:auto; padding:30px;
  }
  .overview.show { display:block; }
  .overview h2 { text-align:center; margin-bottom:22px; color:var(--accent); }
  .ov-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; max-width:1300px; margin:0 auto; }
  .ov-item {
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px; cursor:pointer; transition:.18s;
  }
  .ov-item:hover { border-color:var(--accent); transform:translateY(-3px); }
  .ov-item .ovn { font-size:11px; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .ov-item .ovt { font-size:13px; line-height:1.7; color:var(--text); }
  .ov-close { position:sticky; top:0; float:left; }

  @media (max-width:900px){
    .slide { padding:28px 24px; }
    h1.slide-title { font-size:24px; }
    ul.content li { font-size:14px; }
    .grid2,.grid3,.toc { grid-template-columns:1fr; }
    .title-slide h1 { font-size:26px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">Serverless <span>— معماری و مقایسه با رویکردهای سنتی</span></div>
    <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
    <div class="counter" id="counter">1 / 50</div>
    <button class="btn" id="btnNotes" title="یادداشت ارائه‌دهنده (P)">یادداشت</button>
    <button class="btn" id="btnOverview" title="نمای کلی (O)">فهرست</button>
    <button class="btn" id="btnFull" title="تمام‌صفحه (F)">⛶</button>
  </div>

  <div class="stage" id="stage"><!-- slides injected --></div>

  <div class="notes" id="notes">
    <h3>📄 توضیحات ارائه‌دهنده (حدود ۲ دقیقه)</h3>
    <p id="notesText"></p>
  </div>

  <div class="bottombar">
    <div class="nav">
      <button class="btn" id="prev">▶ قبلی</button>
      <button class="btn" id="next">بعدی ◀</button>
    </div>
    <div class="hint">
      با <kbd>→</kbd> <kbd>←</kbd> جابه‌جا شوید · <kbd>P</kbd> یادداشت · <kbd>O</kbd> فهرست · <kbd>F</kbd> تمام‌صفحه
    </div>
    <div class="nav">
      <button class="btn" id="first">⏮ اول</button>
      <button class="btn" id="last">آخر ⏭</button>
    </div>
  </div>
</div>

<div class="overview" id="overview">
  <button class="btn ov-close" id="ovClose">✕ بستن</button>
  <h2>فهرست کل اسلایدها</h2>
  <div class="ov-grid" id="ovGrid"></div>
</div>

<script>
const slides = [
/* 1 */ {type:"title", title:"معماری Serverless و مقایسه جامع آن با رویکردهای سنتی",
  sub:"بررسی تکامل پردازش ابری، الگوی FaaS، تحلیل هزینه‌ها و چالش‌های پیاده‌سازی",
  meta:[["ارائه‌دهنده","میلاد طحانیان فینی"],["استاد راهنما","استاد محمدرضا باباولیان"],["دانشگاه","دانشگاه ملی مهارت شهید رجایی کاشان"],["زمان تخمینی","۶۰ دقیقه"]],
  notes:"با سلام و احترام خدمت استاد گرامی جناب آقای باباولیان و حضار محترم. امروز در این ارائه تخصصی به بررسی یکی از مهم‌ترین و مدرن‌ترین رویکردهای معماری نرم‌افزار در عصر پردازش ابری، یعنی معماری Serverless یا بدون سرور می‌پردازیم. هدف این ارائه، تحلیل سیر تکاملی سیستم‌های رایانشی از معماری‌های یکپارچه سنتی تا معماری‌های رویدادمحور بدون سرور، بررسی دقیق مزایا، چالش‌ها، الگوهای طراحی و تحلیل هزینه‌های اقتصادی آن است."},

/* 2 */ {type:"toc", title:"سرفصل‌ها و نقشه راه ارائه",
  items:[
    ["بخش اول","سیر تکاملی معماری نرم‌افزار","اسلایدهای ۳ تا ۸"],
    ["بخش دوم","مفاهیم و مؤلفه‌های اصلی Serverless","اسلایدهای ۹ تا ۱۶"],
    ["بخش سوم","مقایسه عمیق با روش‌های سنتی","اسلایدهای ۱۷ تا ۲۶"],
    ["بخش چهارم","اکوسیستم و سرویس‌های ابری","اسلایدهای ۲۷ تا ۳۴"],
    ["بخش پنجم","سناریوهای کاربردی و الگوهای طراحی","اسلایدهای ۳۵ تا ۴۲"],
    ["بخش ششم","چالش‌ها، امنیت و آینده Serverless","اسلایدهای ۴۳ تا ۵۰"]
  ],
  notes:"ارائه امروز ما در ۶ بخش اصلی تقسیم‌بندی شده است. ابتدا نگاهی تاریخی به تکامل زیرساخت‌ها خواهیم داشت تا بفهمیم چه نیازهایی باعث خلق Serverless شد. سپس مؤلفه‌های پایه‌ای مانند FaaS و BaaS را تعریف می‌کنیم. در بخش سوم مقایسه‌ای همه‌جانبه میان روش‌های سنتی، کانتینرها و Serverless انجام می‌دهیم. بخش چهارم به معرفی ابزارها و ارائه‌دهندگان ابری اختصاص دارد. در بخش پنجم سناریوهای واقعی و الگوهای طراحی را بررسی می‌کنیم و در نهایت چالش‌های امنیتی، محدودیت‌ها و آینده این فناوری را نقد خواهیم کرد."},

/* 3 */ {title:"معماری یکپارچه (Monolith) و چالش‌های آن", kicker:"بخش اول · سیر تکامل",
  list:[
    ["📐","<b>تعریف:</b> ترکیب تمامی لایه‌های برنامه (رابط کاربری، منطق تجاری، دسترسی به داده) در یک <span class='hl'>Base Code واحد</span>."],
    ["✅","<b>مزایا اولیه:</b> سادگی اولیه در توسعه و تست پروژه در مقیاس کوچک."],

/* ---------------- Rendering ---------------- */
const stage = document.getElementById('stage');
const esc = s => s;

function renderSlide(s, i){
  const n = i+1;
  let html = `<div class="slide" data-i="${i}">
    <div class="slide-num">اسلاید ${n} از ${slides.length}</div>`;

  if(s.type === "title"){
    html += `<div class="title-slide">
      <div class="logo">☁️</div>
      <h1>${s.title}</h1>
      <div class="sub">${s.sub||""}</div>
      <div class="meta">${(s.meta||[]).map(m=>`<div class="m"><span>${m[0]}</span><b>${m[1]}</b></div>`).join("")}</div>
      ${s.note?`<div class="note">${s.note}</div>`:""}
    </div>`;
  }
  else if(s.type === "divider"){
    html += `<div class="divider">
      <div class="big">${s.num}</div>
      <h1>${s.title}</h1>
      <p>${s.p}</p>
    </div>`;
  }
  else if(s.type === "toc"){
    html += `<span class="kicker">نقشه راه</span>
      <h1 class="slide-title">${s.title}</h1>
      <div class="toc">${s.items.map((it,idx)=>`
        <div class="item"><div class="n">${idx+1}</div>
        <div><div class="t">${it[1]}</div><div class="r">${it[0]} · ${it[2]}</div></div></div>`).join("")}</div>`;
  }
  else {
    html += `${s.kicker?`<span class="kicker ${s.kclass||''}">${s.kicker}</span>`:""}
      <h1 class="slide-title">${s.title}</h1>`;

    if(s.list){
      html += `<ul class="content">${s.list.map(li=>{
        const cls = li[2]?` ${li[2]}`:"";
        const ico = li[0]?`<span class="ico">${li[0]}</span>`:"";
        return `<li class="${cls.trim()}">${ico}<div>${li[1]}</div></li>`;
      }).join("")}</ul>`;
    }
    if(s.grid2){
      html += `<div class="grid2">${s.grid2.map(c=>`
        <div class="card ${c.cls||''}"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}</div>`;
    }
    if(s.grid3){
      html += `<div class="grid3">${s.grid3.map(c=>`
        <div class="card ${c.cls||''}"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}</div>`;
    }
    if(s.flow){
      html += `<div class="flow">${s.flow.map((f,idx)=>`
        ${idx?`<div class="arr">←</div>`:""}
        <div class="step"><div class="n">${f[0]}</div><div class="d">${f[1]}</div></div>`).join("")}</div>`;
    }
    if(s.stats){
      html += `<div class="grid3">${s.stats.map(st=>`
        <div class="stat ${st.c}"><div class="num">${st.n}</div><div class="lbl">${st.l}</div></div>`).join("")}</div>`;
    }
    if(s.formula){
      html += `<div style="margin-top:16px" class="formula">${s.formula}</div>`;
    }
    if(s.table){
      html += `<table class="cmp"><thead><tr>${s.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    if(s.check){
      html += `<div class="check">${s.check.map(c=>`
        <div class="c"><div class="box">✓</div><div>${c[0]}</div>
        <div class="verdict ${c[2]==='yes'?'v-yes':'v-no'}">${c[1]}</div></div>`).join("")}</div>`;
    }
    if(s.note){
      html += `<div class="note">${s.note}</div>`;
    }
  }
  html += `</div>`;
  return html;
}

stage.innerHTML = slides.map(renderSlide).join("");

/* ---------------- Navigation ---------------- */
let cur = 0;
const els = [...document.querySelectorAll('.slide')];
const pbar = document.getElementById('pbar');
const counter = document.getElementById('counter');
const notesEl = document.getElementById('notes');
const notesText = document.getElementById('notesText');

function show(i){
  if(i<0) i=0;
  if(i>slides.length-1) i=slides.length-1;
  cur = i;
  els.forEach((e,idx)=>e.classList.toggle('active', idx===i));
  pbar.style.width = ((i+1)/slides.length*100)+'%';
  counter.textContent = `${i+1} / ${slides.length}`;
  notesText.textContent = slides[i].notes || 'برای این اسلاید یادداشتی ثبت نشده است.';
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===slides.length-1;
  els[i].scrollTop = 0;
}

document.getElementById('next').onclick = ()=>show(cur+1);
document.getElementById('prev').onclick = ()=>show(cur-1);
document.getElementById('first').onclick = ()=>show(0);
document.getElementById('last').onclick = ()=>show(slides.length-1);

document.getElementById('btnNotes').onclick = function(){
  notesEl.classList.toggle('show');
  this.classList.toggle('active');
};

const overview = document.getElementById('overview');
document.getElementById('btnOverview').onclick = ()=>overview.classList.add('show');
document.getElementById('ovClose').onclick = ()=>overview.classList.remove('show');

const ovGrid = document.getElementById('ovGrid');
ovGrid.innerHTML = slides.map((s,i)=>{
  let t = s.title || '';
  return `<div class="ov-item" data-go="${i}"><div class="ovn">اسلاید ${i+1}</div><div class="ovt">${t}</div></div>`;
}).join("");
ovGrid.addEventListener('click', e=>{
  const it = e.target.closest('[data-go]');
  if(it){ show(+it.dataset.go); overview.classList.remove('show'); }
});

document.getElementById('btnFull').onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); show(cur+1); }
  else if(e.key==='ArrowRight' || e.key==='PageUp'){ e.preventDefault(); show(cur-1); }
  else if(e.key==='Home') show(0);
  else if(e.key==='End') show(slides.length-1);
  else if(e.key.toLowerCase()==='p'){ document.getElementById('btnNotes').click(); }
  else if(e.key.toLowerCase()==='o'){ overview.classList.toggle('show'); }
  else if(e.key.toLowerCase()==='f'){ document.getElementById('btnFull').click(); }
  else if(e.key==='Escape'){ overview.classList.remove('show'); }
  else if(e.key==='ArrowDown' && overview.classList.contains('show')) return;
});

/* touch swipe */
let tx=null;
stage.addEventListener('touchstart', e=>tx=e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e=>{
  if(tx===null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if(dx>60) show(cur-1);
  else if(dx<-60) show(cur+1);
  tx=null;
}, {passive:true});

show(0);
</script>
